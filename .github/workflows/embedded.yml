name: Embedded Build

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "master"]

env:
  ZIG_CMD: "uv run python -m ziglang"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    env:
      UV_PROJECT_ENVIRONMENT: /opt/venv

    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        shell: bash
        run: |
          uv sync
          alias zig=${{ env.ZIG_CMD}}
          zig version